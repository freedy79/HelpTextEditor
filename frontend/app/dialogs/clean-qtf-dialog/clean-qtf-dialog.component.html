<h2 mat-dialog-title *ngIf="hasUnusedKeys; else noKeysTitle">
  Clean up QTF
</h2>

<ng-template #noKeysTitle>
  <h2 mat-dialog-title>
    Clean up QTF
  </h2>
</ng-template>

<mat-dialog-content *ngIf="hasUnusedKeys; else noUnusedKeysContent">
  <p>
    {{ currentIndex + 1 }} / {{ totalCount }} unused key<span *ngIf="totalCount !== 1">s</span> found.
  </p>
  <p class="unused-key">
    {{ currentKey }}
  </p>
  <p class="unused-translation">
    {{ currentTranslationPreview }}
  </p>
  <p>
    Do you want to delete this key from the QTF file?
  </p>
</mat-dialog-content>

<ng-template #noUnusedKeysContent>
  <mat-dialog-content>
    <p>No unused keys found. Everything is already clean.</p>
  </mat-dialog-content>
</ng-template>

<mat-dialog-actions align="end" *ngIf="hasUnusedKeys; else closeInfoActions">
  <button mat-button (click)="keep()">Keep</button>
  <button mat-raised-button color="primary" (click)="delete()">Delete</button>
  <button mat-button (click)="cancel()">Cancel cleanup</button>
</mat-dialog-actions>

<ng-template #closeInfoActions>
  <mat-dialog-actions align="end">
    <button mat-button color="primary" (click)="closeInfo()">Close</button>
  </mat-dialog-actions>
</ng-template>
