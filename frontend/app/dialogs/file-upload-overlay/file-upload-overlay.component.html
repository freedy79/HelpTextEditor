<div class="overlay-backdrop">
  <div class="overlay-panel">
    <button class="close-button" (click)="onCancel()" aria-label="Dialog schließen">×</button>

    <header class="panel-header">
      <h2>Dateien hochladen</h2>
      <p class="panel-description">
        Bitte wählen Sie die Helptext.json und Helptext.qtf in einem Schritt aus. Beide Dateien
        werden benötigt, bevor der Import gestartet werden kann.
      </p>
    </header>

    <div class="upload-grid">
      <section class="upload-card">
        <div class="upload-card__header">
          <div class="upload-icon" aria-hidden="true">📂</div>
          <div>
            <h3>Helptext.json + Helptext.qtf</h3>
            <p>Struktur und Inhalte gemeinsam auswählen</p>
          </div>
        </div>
        <button class="select-button" (click)="selectFiles()">Dateien auswählen</button>
        <input
          #fileInput
          type="file"
          accept=".json,.qtf"
          multiple
          class="hidden-input"
          (change)="onFilesSelected($event)"
        />
        <div class="file-summary" *ngIf="jsonFileName || qtfFileName">
          <div class="file-name" *ngIf="jsonFileName">
            <span class="status-dot status-dot--ready"></span>
            {{ jsonFileName }}
          </div>
          <div class="file-name" *ngIf="qtfFileName">
            <span class="status-dot status-dot--ready"></span>
            {{ qtfFileName }}
          </div>
        </div>
      </section>
    </div>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <div class="actions">
      <button class="ghost-button" (click)="onCancel()">Abbrechen</button>
      <button class="primary-button" [disabled]="!isOkEnabled()" (click)="onOk()">
        Import starten
      </button>
    </div>
  </div>
</div>
