<div class="statusbar" role="status" aria-live="polite">
  <div class="status-item">
    <span class="label">Top level:</span>
    <span class="value">{{ topLevelLabel }}</span>
  </div>
  <div class="status-item">
    <span class="label">Translation IDs:</span>
    <span class="value">{{ translationIdCountLabel }}</span>
  </div>
  <div class="status-item">
    <span class="label">Language:</span>
    <span class="value">{{ language || 'Not set' }}</span>
  </div>
  <div class="status-item" [class.dirty]="isDirty">
    <span class="label">Status:</span>
    <span class="value">{{ statusLabel }}</span>
  </div>
  <div class="status-item">
    <span class="label">Version:</span>
    <span class="value">{{ versionLabel }}</span>
  </div>
</div>
